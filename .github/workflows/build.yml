# Builds DrugRunTerritories against DrugLab and runs the full test suite.
name: Build

# Runs on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; it never writes to it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checks out this repository into its own folder, next to DrugLab.
      - name: Check out DrugRunTerritories
        uses: actions/checkout@v7
        with:
          path: DrugRunTerritories

      # DrugLab is not published to a Maven repository, so CI builds and installs it first.
      # DrugLab is private: the DRUGLAB_TOKEN secret must be a token that can read it.
      # Set the DRUGLAB_REPOSITORY variable (owner/name) if it differs from the default.
      - name: Check out DrugLab
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.DRUGLAB_REPOSITORY || 'APonder-Dev/DrugLab-MCPL' }}
          # Branch or tag of DrugLab to build against. It must contain the integration hooks
          # (ModifierProvider, PlantDestroyEvent, ...). Set the DRUGLAB_REF variable to override.
          ref: ${{ vars.DRUGLAB_REF || '' }}
          path: DrugLab
          token: ${{ secrets.DRUGLAB_TOKEN || github.token }}

      # Installs Java 25 (needed for Paper 26.3) and caches downloaded Maven dependencies between runs.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          # Shows Java compiler errors, warnings and uncaught exceptions as annotations on pull request diffs.
          problem-matcher: true

      # Builds DrugLab and puts it in the local Maven repository so this plugin can compile against it.
      - name: Install DrugLab locally
        working-directory: DrugLab
        run: mvn -B -q install -DskipTests

      # Compiles the plugin, runs every unit test and builds the shaded JAR.
      - name: Build and test
        working-directory: DrugRunTerritories
        run: mvn -B clean verify

      # Uploads the test results, even when the build fails, so failures can be inspected.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: DrugRunTerritories/target/surefire-reports

      # The plugin JAR is deliberately not uploaded: this repository is public and builds are not released yet.
